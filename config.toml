[project]
id = "default"
name = "OpenCTO"
workspace_root = "."

[memory]
path = "data/memory.db"
sqlite_vec_path = ""
sqlite_vec_required = false
busy_timeout = "5s"

[llm]
provider = "openai"
base_url = "http://127.0.0.1:4000"
model_reasoning = "gpt-5.4-mini"
model_fast = "gpt-5.4-nano"
embedding_model = "text-embedding-3-small"
embedding_dimensions = 1536

[temporal]
host_port = "127.0.0.1:7233"
namespace = "default"
task_queue = "opencto"
continue_as_new_after_events = 1000

[channels.discord]
enabled = true

[vault]
provider = "keyring"
service = "opencto"

[observability]
log_level = "INFO"
json_logs = true
