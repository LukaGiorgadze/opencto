root = "."
testdata_dir = "testdata"
tmp_dir = "tmp"

[build]
cmd = "env GOCACHE=$(pwd)/.gocache GOMODCACHE=$(pwd)/.gomodcache go build -o ./tmp/opencto ./cmd/opencto"
bin = "tmp/opencto"
full_bin = "./tmp/opencto serve"
include_ext = ["go", "toml", "yaml", "yml", "json", "md"]
exclude_dir = [".git", ".gocache", ".gomodcache", "data", "dist", "node_modules", "tmp", "vendor"]
exclude_regex = ["_test\\.go"]
exclude_unchanged = true
follow_symlink = true
delay = 1000
stop_on_error = true
send_interrupt = true
kill_delay = 1000

[log]
time = true
