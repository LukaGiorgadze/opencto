name: opencto

services:
  postgresql:
    image: postgres:18
    container_name: opencto-postgresql
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
    networks:
      - opencto-network
    volumes:
      - postgresql_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 10s

  temporal-admin-tools:
    image: temporalio/admin-tools:latest
    container_name: opencto-temporal-admin-tools
    restart: on-failure:6
    depends_on:
      postgresql:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal
      POSTGRES_SEEDS: postgresql
      SQL_PLUGIN: postgres12
    networks:
      - opencto-network
    volumes:
      - ./deployment/scripts:/scripts:ro
    entrypoint: ["/bin/sh", "/scripts/setup-postgres.sh"]

  temporal:
    image: temporalio/server:latest
    container_name: opencto-temporal
    restart: unless-stopped
    depends_on:
      temporal-admin-tools:
        condition: service_completed_successfully
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal
      POSTGRES_SEEDS: postgresql
      BIND_ON_IP: 0.0.0.0
      DYNAMIC_CONFIG_FILE_PATH: /etc/temporal/config/dynamicconfig/development-sql.yml
      TEMPORAL_CLI_ADDRESS: temporal:7233
    networks:
      - opencto-network
    ports:
      - "7233:7233"
    volumes:
      - ./deployment/dynamicconfig:/etc/temporal/config/dynamicconfig:ro
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "7233"]
      interval: 5s
      timeout: 3s
      start_period: 20s
      retries: 60

  temporal-create-namespace:
    image: temporalio/admin-tools:latest
    container_name: opencto-temporal-create-namespace
    restart: on-failure:5
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      DEFAULT_NAMESPACE: default
      TEMPORAL_NAMESPACE_RETENTION: 24h
    networks:
      - opencto-network
    volumes:
      - ./deployment/scripts:/scripts:ro
    entrypoint: ["/bin/sh", "/scripts/create-namespace.sh"]

  temporal-init:
    image: temporalio/admin-tools:latest
    container_name: opencto-temporal-init
    restart: on-failure:5
    depends_on:
      temporal-create-namespace:
        condition: service_completed_successfully
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      DEFAULT_NAMESPACE: default
      TEMPORAL_SEARCH_ATTRIBUTES: opencto_project_id
    networks:
      - opencto-network
    volumes:
      - ./deployment/scripts:/scripts:ro
    entrypoint: ["/bin/sh", "/scripts/temporal-init-entrypoint.sh"]

  temporal-ui:
    image: temporalio/ui:latest
    container_name: opencto-temporal-ui
    restart: unless-stopped
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:3000
    networks:
      - opencto-network
    ports:
      - "8080:8080"

  bifrost:
    image: maximhq/bifrost:latest
    container_name: opencto-bifrost
    restart: unless-stopped
    profiles:
      - bifrost
    depends_on:
      postgresql:
        condition: service_healthy
    env_file:
      - .env
    environment:
      BIFROST_API_KEY: ${BIFROST_API_KEY:-sk-bf-opencto-local}
    volumes:
      - ./bifrost.json:/app/data/config.json:ro
    networks:
      - opencto-network
    ports:
      - "4000:8080"
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://localhost:8080/health >/dev/null
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  opencto-network:
    driver: bridge
    name: opencto-network

volumes:
  postgresql_data:
