root = "."
tmp_dir = "tmp"

[build]
cmd = "env GOCACHE=$(pwd)/.gocache GOMODCACHE=$(pwd)/.gomodcache go build -o ./tmp/opencto ./cmd/opencto"
bin = "tmp/opencto"
full_bin = "./tmp/opencto -mode worker"
include_ext = ["go", "toml", "yaml", "yml", "json"]
exclude_dir = [".git", ".gocache", ".gomodcache", "data", "dist", "node_modules", "tmp", "vendor"]
exclude_regex = ["_test\\.go"]
exclude_unchanged = true
follow_symlink = true
log = "air.worker.log"
stop_on_error = true
kill_delay = "500ms"

[log]
time = true
main_only = true

[screen]
clear_on_rebuild = false
keep_scroll = true
